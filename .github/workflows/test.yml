name: test

# On every pull request, but only on push to master
on:
  push:
    branches:
    - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        pandas-version: ["<3", ">=3"]
        # pandas 3 supports python 3.11 and higher
        exclude:
          - python-version: "3.9"
            pandas-version: ">=3"
          - python-version: "3.10"
            pandas-version: ">=3"

    steps:
      - uses: actions/checkout@v7

      # uv installs the Python version itself, so this doesn't depend on which
      # versions the runner image provides
      - name: Install a specific version of uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      # `--with` layers the requested pandas over the locked one
      - name: Run tests
        run: uv run --with "pandas${{ matrix.pandas-version }}" pytest
