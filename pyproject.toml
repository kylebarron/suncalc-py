[project]
name = "suncalc"
version = "0.1.3"
description = "A fast, vectorized Python port of suncalc.js"
readme = "README.md"
authors = [{ name = "Kyle Barron", email = "kylebarron2@gmail.com" }]
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
]
keywords = ["suncalc", "sun"]
dependencies = ["numpy"]

[project.optional-dependencies]
# pandas 2.0 added `as_unit`, which handling pandas datetimes relies on
pandas = ["pandas>=2"]

[project.urls]
Homepage = "https://github.com/kylebarron/suncalc-py"
Repository = "https://github.com/kylebarron/suncalc-py"
Issues = "https://github.com/kylebarron/suncalc-py/issues"
Changelog = "https://github.com/kylebarron/suncalc-py/blob/master/CHANGELOG.md"

[dependency-groups]
dev = ["pandas>=2", "pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["suncalc", "suncalc.*"]
